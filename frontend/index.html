<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Studio - YouTube Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-indigo-400">Video Automation Dashboard</h1>
            <p class="text-slate-400">Generate, review, render, and publish YouTube content.</p>
        </header>

        <!-- Pipeline Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Left Panel: Content Creation -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-xl font-semibold text-slate-200">1. Data & Script Setup</h2>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Stock Ticker Symbol</label>
                    <div class="flex gap-2">
                        <input id="tickerInput" type="text" value="AAPL" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white w-full">
                        <button onclick="generateScript()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded font-medium">Fetch Data</button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Generated Script (Editable)</label>
                    <textarea id="scriptBox" rows="6" class="bg-slate-900 border border-slate-700 rounded p-3 text-white w-full text-sm"></textarea>
                </div>

                <button onclick="renderVideo()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded font-medium">
                    2. Render Voice & Video
                </button>
            </div>

            <!-- Right Panel: Review & Approval -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-xl font-semibold text-slate-200">2. Review & Approve</h2>
                
                <div class="bg-black aspect-[9/16] max-h-[300px] mx-auto rounded overflow-hidden flex items-center justify-center border border-slate-700 relative">
                    <video id="videoPreview" controls class="h-full hidden"></video>
                    <div id="loadingSpinner" class="hidden text-indigo-400 text-sm animate-pulse">Rendering Video on Cloud...</div>
                    <span id="placeholderText" class="text-slate-500 text-sm">No video rendered yet</span>
                </div>

                <div class="space-y-2">
                    <input id="videoTitle" type="text" placeholder="YouTube Video Title" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white w-full text-sm">
                    <input id="videoDesc" type="text" placeholder="Video Description" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white w-full text-sm">
                </div>

                <button onclick="approveVideo()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-medium">
                    3. Approve & Publish to YouTube
                </button>
            </div>
        </div>

        <!-- Status Log -->
        <div id="statusBox" class="bg-slate-950 p-4 rounded border border-slate-800 text-sm font-mono text-slate-400">
            System ready. Enter a ticker to begin pipeline.
        </div>
    </div>

    <script>
        // REPLACE THIS URL WITH YOUR DEPLOYED RENDER BACKEND URL ONCE LIVE
        const API_BASE = "https://youtube-automation-engine.onrender.com/api";
        let currentVideoFilename = "";

        function log(msg) {
            document.getElementById("statusBox").innerText = `> ${msg}`;
        }

        async function generateScript() {
            const ticker = document.getElementById("tickerInput").value;
            log(`Fetching market data for ${ticker}...`);
            try {
                const res = await fetch(`${API_BASE}/generate-script`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ticker })
                });
                const data = await res.json();
                document.getElementById("scriptBox").value = data.script;
                document.getElementById("videoTitle").value = `${ticker.toUpperCase()} Market Update - Daily Breakdown`;
                document.getElementById("videoDesc").value = `Automated analysis for ${ticker.toUpperCase()} stock movement.`;
                log("Script generated successfully. Review text and click Render.");
            } catch (err) {
                log("Error generating script: " + err);
            }
        }

        async function renderVideo() {
            const scriptText = document.getElementById("scriptBox").value;
            log("Submitting render task to background worker...");
            
            document.getElementById("placeholderText").classList.add("hidden");
            document.getElementById("videoPreview").classList.add("hidden");
            document.getElementById("loadingSpinner").classList.remove("hidden");

            try {
                const res = await fetch(`${API_BASE}/render-video`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ script_text: scriptText })
                });
                const data = await res.json();
                pollJobStatus(data.job_id);
            } catch (err) {
                log("Error initiating render: " + err);
                document.getElementById("loadingSpinner").classList.add("hidden");
                document.getElementById("placeholderText").classList.remove("hidden");
            }
        }

        async function pollJobStatus(jobId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/job-status/${jobId}`);
                    const job = await res.json();
                    
                    if (job.status === "completed") {
                        clearInterval(interval);
                        currentVideoFilename = job.filename;
                        const videoEl = document.getElementById("videoPreview");
                        videoEl.src = `${API_BASE.replace('/api', '')}${job.video_url}`;
                        
                        document.getElementById("loadingSpinner").classList.add("hidden");
                        videoEl.classList.remove("hidden");
                        log("Render complete! Video is ready for preview.");
                    } else if (job.status === "failed") {
                        clearInterval(interval);
                        document.getElementById("loadingSpinner").classList.add("hidden");
                        document.getElementById("placeholderText").classList.remove("hidden");
                        log("Render failed: " + job.error);
                    } else {
                        log(`Processing: ${job.progress || 'Rendering in progress...'}`);
                    }
                } catch (err) {
                    clearInterval(interval);
                    log("Polling error: " + err);
                }
            }, 3000);
        }

        async function approveVideo() {
            if (!currentVideoFilename) {
                log("Error: Please render a video before approving.");
                return;
            }
            const title = document.getElementById("videoTitle").value;
            const description = document.getElementById("videoDesc").value;

            log("Submitting approval to YouTube API engine...");
            try {
                const res = await fetch(`${API_BASE}/approve-upload`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        video_filename: currentVideoFilename,
                        title: title,
                        description: description
                    })
                });
                const data = await res.json();
                log("SUCCESS: " + data.message);
            } catch (err) {
                log("Error approving video: " + err);
            }
        }
    </script>
</body>
</html>
