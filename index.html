<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Niche Video Automation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold text-emerald-400">AI Video Automation Engine</h1>
      <p class="text-slate-400 mt-1">Generate multi-niche YouTube videos with AI voiceovers and automated stock B-roll.</p>
    </header>

    <!-- Controls Form -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Niche Selection -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Target Niche</label>
          <select id="nicheSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="Health">Health & Biology</option>
            <option value="Military">Military & Defense News</option>
            <option value="Tech">Tech & AI Breakthroughs</option>
            <option value="Crime">Dark History & True Crime</option>
            <option value="Finance">Economy & Business Stories</option>
          </select>
        </div>

        <!-- Aspect Ratio / Format -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Video Format</label>
          <select id="ratioSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="16:9">16:9 Widescreen (YouTube Longform)</option>
            <option value="9:16">9:16 Vertical (YouTube Shorts / TikTok)</option>
          </select>
        </div>
      </div>

      <!-- Topic Input -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Video Topic / Concept</label>
        <input type="text" id="topicInput" placeholder="e.g. What happens to your brain when you sleep 8 hours" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <button id="generateBtn" onclick="generateScript()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-6 rounded-lg transition duration-200">
        1. Generate Script & Visual Keywords
      </button>
    </div>

    <!-- Script / JSON Preview -->
    <div id="scriptSection" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Generated Script Blueprint</h2>
      <textarea id="scriptJsonDisplay" class="w-full h-64 bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-300 focus:outline-none" readonly></textarea>
      
      <button id="renderBtn" onclick="startVideoRender()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
        2. Render Video (Fetch Clips, Synthesize Audio & Burn Subtitles)
      </button>
    </div>

    <!-- Render Status & Video Output -->
    <div id="statusSection" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Rendering Status</h2>
      <p id="statusProgress" class="text-amber-400 font-medium">Initializing...</p>

      <div id="videoPreviewContainer" class="hidden mt-4">
        <h3 class="text-lg font-semibold text-emerald-400 mb-2">Render Complete!</h3>
        <video id="outputVideo" controls class="w-full max-h-[500px] rounded-lg border border-slate-700"></video>
      </div>
    </div>

  </div>

  <script>
    // Update with your actual Render deployment URL
    const BACKEND_URL = "https://main-youtube-automation-engine.onrender.com"; 

    async function generateScript() {
      const topic = document.getElementById("topicInput").value;
      const niche = document.getElementById("nicheSelect").value;
      const ratio = document.getElementById("ratioSelect").value;
      const btn = document.getElementById("generateBtn");

      if (!topic) {
        alert("Please enter a topic!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating Script...";

      try {
        const resp = await fetch(`${BACKEND_URL}/api/generate-script`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            topic: topic,
            niche: niche,
            duration_minutes: 1, // Start with 1 min test videos for fast rendering
            aspect_ratio: ratio
          })
        });

        const data = await resp.json();
        if (data.status === "success") {
          document.getElementById("scriptJsonDisplay").value = data.script_json;
          document.getElementById("scriptSection").classList.remove("hidden");
        } else {
          alert("Error generating script: " + data.detail);
        }
      } catch (err) {
        alert("Server connection failed: " + err);
      } finally {
        btn.disabled = false;
        btn.innerText = "1. Generate Script & Visual Keywords";
      }
    }

    async function startVideoRender() {
      const scriptJson = document.getElementById("scriptJsonDisplay").value;
      const btn = document.getElementById("renderBtn");

      btn.disabled = true;
      document.getElementById("statusSection").classList.remove("hidden");
      document.getElementById("statusProgress").innerText = "Queuing render job...";

      try {
        const resp = await fetch(`${BACKEND_URL}/api/render-video`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ script_json: scriptJson })
        });

        const data = await resp.json();
        if (data.status === "success") {
          pollJobStatus(data.job_id);
        } else {
          document.getElementById("statusProgress").innerText = "Failed to queue job.";
        }
      } catch (err) {
        document.getElementById("statusProgress").innerText = "Error: " + err;
      }
    }

    function pollJobStatus(jobId) {
      const interval = setInterval(async () => {
        try {
          const resp = await fetch(`${BACKEND_URL}/api/job-status/${jobId}`);
          const job = await resp.json();

          if (job.status === "processing" || job.status === "queued") {
            document.getElementById("statusProgress").innerText = job.progress || "Processing...";
          } else if (job.status === "completed") {
            clearInterval(interval);
            document.getElementById("statusProgress").innerText = "Render Finished!";
            
            const videoElem = document.getElementById("outputVideo");
            videoElem.src = `${BACKEND_URL}${job.video_url}`;
            document.getElementById("videoPreviewContainer").classList.remove("hidden");
          } else if (job.status === "failed") {
            clearInterval(interval);
            document.getElementById("statusProgress").innerText = "Render Error: " + job.error;
          }
        } catch (err) {
          console.error("Polling error:", err);
        }
      }, 3000);
    }
  </script>
</body>
</html>
