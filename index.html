<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid AI Video Automation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold text-emerald-400">Hybrid Video Automation Studio</h1>
      <p class="text-slate-400 mt-1">Upload custom video clips, paste full scripts, and let AI generate voiceover & subtitles.</p>
    </header>

    <!-- Step 1: Upload Clips -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-200">1. Upload B-Roll Videos (.mp4)</h2>
      <input type="file" id="videoFiles" multiple accept="video/mp4,video/mov,video/avi" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-600 cursor-pointer">
      <button id="uploadBtn" onclick="uploadClips()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-6 rounded-lg transition duration-200">
        Upload Selected Video Clips
      </button>
      <p id="uploadStatus" class="text-sm font-semibold text-amber-400"></p>
    </div>

    <!-- Step 2: Script & Settings -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6">
      <h2 class="text-xl font-bold text-slate-200">2. Script & Niche Settings</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Target Niche Voice</label>
          <select id="nicheSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="Military">Military & Tactical (Deep Voice)</option>
            <option value="Health">Health & Biology (Clear Voice)</option>
            <option value="Tech">Tech & AI Breakthroughs</option>
            <option value="Crime">Dark History & True Crime</option>
            <option value="Finance">Economy & Business Stories</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Video Format</label>
          <select id="ratioSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="16:9">16:9 Widescreen (YouTube Longform)</option>
            <option value="9:16">9:16 Vertical (YouTube Shorts / TikTok)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Full Video Script / Narration</label>
        <textarea id="scriptText" placeholder="Paste your full custom script here..." class="w-full h-48 bg-slate-900 border border-slate-700 rounded-lg p-4 font-sans text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
      </div>

      <button id="renderBtn" onclick="startRender()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
        3. Render Final Video
      </button>
    </div>

    <!-- Step 3: Progress & Output -->
    <div id="statusSection" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-200">Rendering Status</h2>
      <p id="statusProgress" class="text-amber-400 font-medium">Initializing...</p>

      <div id="videoPreviewContainer" class="hidden mt-4">
        <h3 class="text-lg font-semibold text-emerald-400 mb-2">Render Complete!</h3>
        <video id="outputVideo" controls class="w-full max-h-[500px] rounded-lg border border-slate-700"></video>
      </div>
    </div>

  </div>

  <script>
    const BACKEND_URL = "https://youtube-automation-engine.onrender.com"; 
    let activeSessionId = "";

    async function uploadClips() {
      const fileInput = document.getElementById("videoFiles");
      const statusText = document.getElementById("uploadStatus");

      if (!fileInput.files.length) {
        alert("Please select at least one .mp4 video file.");
        return;
      }

      const formData = new FormData();
      for (let i = 0; i < fileInput.files.length; i++) {
        formData.append("files", fileInput.files[i]);
      }

      statusText.innerText = "Uploading clips to server...";

      try {
        const resp = await fetch(`${BACKEND_URL}/api/upload-clips`, {
          method: "POST",
          body: formData
        });

        const data = await resp.json();
        if (data.status === "success") {
          activeSessionId = data.session_id;
          statusText.innerText = `Successfully uploaded ${data.clip_paths.length} clip(s)! Ready to render.`;
        } else {
          statusText.innerText = "Upload failed: " + data.detail;
        }
      } catch (err) {
        statusText.innerText = "Upload error: " + err;
      }
    }

    async function startRender() {
      const scriptText = document.getElementById("scriptText").value.trim();
      const niche = document.getElementById("nicheSelect").value;
      const aspect_ratio = document.getElementById("ratioSelect").value;

      if (!scriptText) {
        alert("Please enter a script.");
        return;
      }

      if (!activeSessionId) {
        alert("Please upload at least one video clip first.");
        return;
      }

      document.getElementById("statusSection").classList.remove("hidden");
      document.getElementById("statusProgress").innerText = "Submitting render job...";

      const formData = new FormData();
      formData.append("script_text", scriptText);
      formData.append("niche", niche);
      formData.append("aspect_ratio", aspect_ratio);
      formData.append("session_id", activeSessionId);

      try {
        const resp = await fetch(`${BACKEND_URL}/api/render-hybrid`, {
          method: "POST",
          body: formData
        });

        const data = await resp.json();
        if (data.status === "success") {
          pollJobStatus(data.job_id);
        } else {
          document.getElementById("statusProgress").innerText = "Failed to queue job.";
        }
      } catch (err) {
        document.getElementById("statusProgress").innerText = "Error: " + err;
      }
    }

    function pollJobStatus(jobId) {
      const interval = setInterval(async () => {
        try {
          const resp = await fetch(`${BACKEND_URL}/api/job-status/${jobId}`);
          const job = await resp.json();

          if (job.status === "processing" || job.status === "queued") {
            document.getElementById("statusProgress").innerText = job.progress || "Processing...";
          } else if (job.status === "completed") {
            clearInterval(interval);
            document.getElementById("statusProgress").innerText = "Render Finished!";
            
            const videoElem = document.getElementById("outputVideo");
            videoElem.src = `${BACKEND_URL}${job.video_url}`;
            document.getElementById("videoPreviewContainer").classList.remove("hidden");
          } else if (job.status === "failed") {
            clearInterval(interval);
            document.getElementById("statusProgress").innerText = "Render Error: " + job.error;
          }
        } catch (err) {
          console.error("Polling error:", err);
        }
      }, 3000);
    }
  </script>
</body>
</html>
